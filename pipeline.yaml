apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: tax-calculator-pipeline
spec:
  workspaces:
    - name: source
  tasks:
    - name: npminstall
      taskRef:
        name: npm
      workspaces:
        - name: source
          workspace: source
    - name: tests
      taskRef:
        name: jasmine
      runAfter:
        - npminstall
      workspaces:
        - name: source
          workspace: source
    - name: build
      taskSpec:
        steps:
          - name: docker-build
            image: quay.io/buildah/stable
            script: |
              echo "Building tax-calculator image"
      runAfter:
        - tests
